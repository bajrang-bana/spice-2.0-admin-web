server {
    listen 80;
    server_name localhost;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect root / to /medtronics-ai-coaching/home
    location = / {
        return 302 /medtronics-ai-coaching/home;
    }

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Match static assets requested under any route prefix (e.g. /my-prefix/assets/...)
    location ~ ^/.*/assets/(.*)$ {
        alias /usr/share/nginx/html/assets/$1;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
