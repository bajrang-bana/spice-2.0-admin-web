server {
    listen 80;
    server_name localhost;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect root / to /medtronics-ai-coaching/home
    location = / {
        return 302 /medtronics-ai-coaching/home;
    }

    # Disable cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Match static assets under /assets/ directly or with any route prefix (e.g. /medtronics-ai-coaching/assets/...)
    location ~ ^/(.+)/assets/(.*)$ {
        rewrite ^/(.+)/assets/(.*)$ /assets/$2 break;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Match common static files (favicon, manifest, icons, images, fonts) requested under route prefix
    location ~ ^/(.+)/(app-favicon\.png|manifest\.json|favicon\.ico|robots\.txt)$ {
        rewrite ^/(.+)/(.*)$ /$2 break;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Catch-all static asset extensions under any prefix to ensure missing static files return 404 rather than fallback HTML
    location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|map)$ {
        rewrite ^/(.+)/(assets/.*)$ /$1 break;
        rewrite ^/(.+)/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
